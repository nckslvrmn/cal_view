name: Deploy Image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  push-cal-view-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@v7

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push with version tag
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cal_view:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cal_view:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: push-cal-view-image
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: nckslvrmn/docker-compose-deploy@main
        with:
          file: compose.yml
        env:
          CAL_VIEW_VERSION: ${{ github.ref_name }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
